#
# Build, test, and coverage. Everything runs inside the nix devShell.a
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: neither job writes to the repo (coverage is uploaded to Codecov).
permissions:
  contents: read

# Supersede an in-flight run for the same ref (e.g. a force-push to a PR).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          diagnostic-endpoint: ""

      - name: Tap into cachix stores
        uses: cachix/cachix-action@v15
        with:
          name: lens-forge
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build
        run: nix develop --command cargo build --all-targets --locked

      - name: Test
        run: nix develop --command cargo test --locked

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          diagnostic-endpoint: ""

      - name: Tap into cachix stores
        uses: cachix/cachix-action@v15
        with:
          name: lens-forge
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cov-

      - name: Collect coverage
        run: nix develop --command cargo llvm-cov --locked --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
