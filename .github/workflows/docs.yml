#
# Build the API docs (with KaTeX math) and publish them to GitHub Pages.
# The actual build command lives in ./docs/build-docs.sh so local and CI
# builds stay in sync.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token, plus what the Pages deploy action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install nix
      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          diagnostic-endpoint: ""

      - name: Tap into cachix stores
        uses: cachix/cachix-action@v15
        with:
          name: lens-forge
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          extraPullNames: nix-community

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-docs-cargo-${{ hashFiles('Cargo.lock', 'flake.lock') }}
          restore-keys: ${{ runner.os }}-docs-cargo-

      - name: Build API docs
        run: ./docs/build-docs.sh

      - name: Add docs root redirect
        run: |
          echo '<meta http-equiv="refresh" content="0; url=lens_forge/index.html">' \
            > target/doc/index.html

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
