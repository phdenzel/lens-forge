#
# Build the API docs (with KaTeX math) and publish them to GitHub Pages.
# The actual build command lives in ./docs/build-docs.sh so local and CI
# builds stay in sync.
name: docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least-privilege token, plus what the Pages deploy action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deployment at a time; don't cancel an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nix provides the same toolchain + system deps (libiconv, wgpu, …) as
      # the local dev shell, so `cargo doc` compiles the crate identically.
      - uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API docs
        run: ./docs/build-docs.sh

      # `cargo doc` writes to target/doc/<crate>/; add a root redirect so the
      # Pages URL lands on the crate index.
      - name: Add root redirect
        run: |
          echo '<meta http-equiv="refresh" content="0; url=lens_forge/index.html">' \
            > target/doc/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
