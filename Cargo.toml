[package]
name = "lens_forge"
version = "0.1.0"
edition = "2024"

[dependencies]
burn = { version = "0.19.1", features = ["wgpu", "train"] }
burn-autodiff = "0.19.1"
colorgrad = { version = "0.8.0", features = ["named-colors", "preset"] }
image = "0.25.9"
imageproc = "0.25.0"
tokio = { version = "1.48.0", features = ["rt", "macros", "full"] }

[dev-dependencies]
burn-ndarray = "0.19.1"
