[package]
name = "lens-forge"
version = "0.1.0"
edition = "2024"

[dependencies]
colorgrad = { version = "0.8.0", features = ["preset"] }
image = "0.25.9"
imageproc = "0.25.0"
ndarray = { version = "0.17.1", features = ["rayon"] }
num = "0.4.3"
phastft = "0.3.0"
pollster = "0.4.0"
rayon = "1.11.0"
tokio = { version = "1.48.0", features = ["rt", "macros", "full"] }
wgpu = "28.0.0"
winit = "0.30.12"

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }

[[bench]]
name = "scale_bench"
harness = false
