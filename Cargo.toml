[package]
name = "lens-forge"
version = "0.1.0"
edition = "2024"
description = "A blazingly fast Rust gravitational-lens modelling library (forward simulation and inverse reconstruction)."
license = "GPL-3.0-or-later"
repository = "https://github.com/phdenzel/lens-forge"
homepage = "https://github.com/phdenzel/lens-forge"
readme = "README.md"
keywords = ["lensing", "gravitational", "astrophysics", "cosmology", "simulation"]
categories = ["science", "mathematics", "simulation"]

[dependencies]
colorgrad = { version = "0.8.0", features = ["preset"] }
image = "0.25.9"
imageproc = "0.25.0"
ndarray = { version = "0.17.1", features = ["rayon"] }
num = "0.4.3"
phastft = "0.3.0"
pollster = "0.4.0"
rayon = "1.11.0"
tokio = { version = "1.48.0", features = ["rt", "macros", "full"] }
wgpu = "28.0.0"
winit = "0.30.12"

[dev-dependencies]
criterion = { version = "0.8.1", features = ["html_reports"] }

[features]
# Run the full parameter sweep in the benches (all sizes/stencils). Off by
# default so `cargo bench` stays quick; enable with `--features full-bench`.
full-bench = []

[[bench]]
name = "scale_bench"
harness = false

[[bench]]
name = "pixelgrid_ops"
harness = false

[[bench]]
name = "meshgrid_locate"
harness = false

[[bench]]
name = "fastsum_bench"
harness = false

# Render LaTeX math on docs.rs (mirrors `./docs/build-docs.sh` for local builds).
[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "docs/katex-header.html"]
